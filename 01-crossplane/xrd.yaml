# =====================================================================
# Crossplane XRD — CompositeResourceDefinition
# =====================================================================
# TODO 2: Completa este archivo con tu XRD
#
# Guía de referencia:
#   https://docs.crossplane.io/latest/concepts/composite-resource-definitions/
#
# Este XRD debe:
#   - Definir un Composite Resource llamado XPostgreSQLInstance
#   - Exponer al menos 2 parámetros (ej: dbName, owner)
#   - Usar el grupo database.poc.io/v1alpha1
# =====================================================================

apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xpostgresqlinstances.database.poc.io
spec:
  group: database.poc.io
  names:
    kind: XPostgreSQLInstance
    plural: xpostgresqlinstances
    singular: xpostgresqlinstance
    shortNames:
      - xpg
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                compositionSelector:
                  type: object
                compositionRef:
                  type: object
                writeConnectionSecretToRef:
                  type: object
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                forProvider:
                  type: object
                  properties:
                    dbName:
                      type: string
                      description: "Nombre de la base de datos"
                    owner:
                      type: string
                      description: "Usuario propietario de la base de datos"
                    version:
                      type: string
                      description: "Versión de PostgreSQL"
              required:
                - forProvider
            status:
              type: object
              properties:
                conditions:
                  type: array
                  items:
                    type: object
      additionalPrinterColumns:
        - name: DB
          type: string
          jsonPath: .spec.forProvider.dbName
        - name: Owner
          type: string
          jsonPath: .spec.forProvider.owner
